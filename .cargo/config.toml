[env]
# cef-dll-sys downloads the CEF binary distribution here on first build.
CEF_PATH = { value = "third_party/cef", relative = true }

[alias]
# `cargo xtask package [--target <triple>]`: a Gate folder and archive in dist/.
# `cargo xtask check-windows`: cross-build Gate for Windows to catch errors.
xtask = "run --package xtask --"
