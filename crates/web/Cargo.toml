[package]
name = "web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
# Re-exports the CEF distribution directory (DEP_OPUS_CEF_CEF_DIR) so the app
# can point its rpath at libcef.so.
links = "opus_cef"

[features]
# Chromium (CEF). Windows and macOS builds have it; Linux runs on WPE WebKit
# and can add it (`--features web/cef`, then `GATE_ENGINE=cef`).
cef = ["dep:cef", "dep:cef-dll-sys"]

[dependencies]
cef = { workspace = true, optional = true }
# Direct dependency only to read its `CEF_DIR` build metadata.
cef-dll-sys = { version = "=156.3.0", optional = true }
gpui.workspace = true
anyhow.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false }
futures = "0.3"
sha2 = "0.10"
async-channel = "2"

# The glib bridge (Chromium's X11 clipboard waits on glib's main loop).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The WPE helper's protocol.
serde_json.workspace = true
# SVG favicons, which WebKit's icon database does not decode.
resvg = { version = "0.46", default-features = false }

# Edge (WebView2) in visual-hosting mode, composited in zui's overlay plane;
# windows 0.61 as gpui_windows uses, so COM types interoperate.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_DirectComposition", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Pipes", "Win32_System_IO", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61"
raw-window-handle = "0.6"
serde_json.workspace = true
# Favicons arrive as PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
