[package]
name = "web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
# Re-exports the CEF distribution directory (DEP_OPUS_CEF_CEF_DIR) so the app
# can point its rpath at libcef.so.
links = "opus_cef"

[dependencies]
cef.workspace = true
# Direct dependency only to read its `CEF_DIR` build metadata.
cef-dll-sys = "=156.3.0"
gpui.workspace = true
anyhow.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false }
futures = "0.3"
sha2 = "0.10"
async-channel = "2"

# The glib bridge (Chromium's X11 clipboard waits on glib's main loop).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
