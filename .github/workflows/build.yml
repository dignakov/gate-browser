# Builds Gate's packages (`cargo xtask package`): a .deb for Linux, a .zip
# for Windows. Every push to devel or main: both are attached to the run.
# A pushed tag v*: a GitHub Release is made with both attached.
name: build

on:
  push:
    branches: [devel, main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    # Building WPE WebKit takes hours; it is cached after.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config dpkg-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libglib2.0-dev \
            libvulkan-dev libssl-dev libzstd-dev \
            gperf unifdef ruby perl python3 libglib2.0-dev-bin libxml2-utils \
            libavif-dev libbrotli-dev libdrm-dev libepoxy-dev libexpat1-dev \
            libgbm-dev libgcrypt20-dev libgpg-error-dev libharfbuzz-dev libicu-dev \
            libjpeg-dev liblcms2-dev libpng-dev libsoup-3.0-dev libsqlite3-dev \
            libtasn1-6-dev libwebp-dev libwoff2-dev libxml2-dev libxslt1-dev zlib1g-dev \
            libegl-dev libgles-dev libjson-glib-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev

      # The install, by what the build depends on: xtask/src/wpe.rs (version,
      # options) and the patches.
      - name: Restore WPE WebKit
        id: wpe
        uses: actions/cache/restore@v4
        with:
          path: third_party/wpe/install
          key: wpe-ubuntu-24.04-${{ hashFiles('xtask/src/wpe.rs', 'xtask/patches/**') }}

      - name: Build WPE WebKit
        if: steps.wpe.outputs.cache-hit != 'true'
        run: GATE_JOBS=$(nproc) cargo xtask build-wpe

      # Saved now, so a later failure doesn't cost the build.
      - name: Save WPE WebKit
        if: steps.wpe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/wpe/install
          key: ${{ steps.wpe.outputs.cache-primary-key }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Package
        run: cargo xtask package --target x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: gate-linux-x86_64
          path: dist/*.deb
          compression-level: 0

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rustup installs the toolchain rust-toolchain.toml names.
      - name: Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      # The CEF distribution (~1 GB) the build downloads; its version
      # follows Cargo.lock's cef-dll-sys.
      - uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-x86_64-pc-windows-msvc-${{ hashFiles('Cargo.lock') }}
          restore-keys: cef-x86_64-pc-windows-msvc-

      - name: Package
        run: cargo xtask package --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: gate-windows-x86_64
          path: dist/gate-windows-x86_64.zip
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --title "Gate $GITHUB_REF_NAME" --generate-notes
