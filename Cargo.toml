[workspace]
members = ["crates/layout", "crates/web", "crates/app", "xtask"]
exclude = ["vendor/zui"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# GPUI: zeronsh/zui (zeron's fork) at the revision zeron ships, vendored so
# fixes land at the root. Adds backdrop blur, rounded clips, edge fades and
# in-place atlas tile updates from pixels or dma-bufs (what web frames use).
gpui = { path = "vendor/zui/crates/gpui" }
gpui_platform = { path = "vendor/zui/crates/gpui_platform", features = ["wayland", "x11", "font-kit", "runtime_shaders"] }
cef = { version = "=156.3.0", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

layout = { path = "crates/layout" }
web = { path = "crates/web" }

[profile.dev]
opt-level = 0
debug = "limited"

# gpui and CEF bindings are slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"

# What packages ship (`cargo xtask package`): release, without symbols.
[profile.dist]
inherits = "release"
strip = true
